
<!DOCTYPE html>  
<html lang="en">  
<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>Products - Baba Plastic</title>  
    <link rel="stylesheet" href="style.css">  
</head>  
<body>  
    <header>  
        <div class="container nav-container">  
            <a href="index.html" class="logo cms-site-logo"><span class="cms-site-name">Baba Plastic</span></a>  
            <button class="hamburger" id="hamburger">  
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>  
            </button>  
            <nav class="nav-links" id="nav-links">  
                <a href="index.html">Home</a>  
                <a href="categories.html">Categories</a>  
                <a href="products.html" style="color:var(--secondary);">Products</a>  
                <a href="about.html">About Us</a>  
                <a href="support.html">Support</a>  
                <div id="auth-nav-ui"></div>  
            </nav>  
        </div>  
    </header>  
  
    <div class="container" style="margin-top:40px; display:flex; gap:30px; flex-wrap:wrap;">  
        <!-- Filters Sidebar -->  
        <aside style="width:250px; flex-shrink:0;">  
            <div style="background:var(--white); padding:20px; border-radius:var(--radius); box-shadow:var(--shadow);">  
                <h3 style="margin-bottom:15px; border-bottom:1px solid #e2e8f0; padding-bottom:10px;">Search</h3>  
                <input type="text" id="search-input" class="form-control" placeholder="Search products..." style="margin-bottom:20px;">  
                  
                <h3 style="margin-bottom:15px; border-bottom:1px solid #e2e8f0; padding-bottom:10px;">Categories</h3>  
                <div id="filter-categories" style="display:flex; flex-direction:column; gap:10px;">  
                    Loading...  
                </div>  
            </div>  
        </aside>  
  
        <!-- Product Grid -->  
        <main style="flex:1;">  
            <div class="grid grid-3" id="products-grid">  
                <p>Loading products...</p>  
            </div>  
        </main>  
    </div>  
  
    <script type="module" src="app.js"></script>  
    <script type="module" src="products.js"></script>  
</body>  
</html>
