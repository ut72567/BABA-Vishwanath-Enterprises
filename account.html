
<!DOCTYPE html>  
<html lang="en">  
<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>My Account - Baba Plastic</title>  
    <link rel="stylesheet" href="style.css">  
</head>  
<body>  
    <header>  
        <div class="container nav-container">  
            <a href="index.html" class="logo cms-site-logo"><span class="cms-site-name">Baba Plastic</span></a>  
            <nav class="nav-links"><a href="index.html">Home</a><a href="products.html">Products</a><div id="auth-nav-ui"></div></nav>  
        </div>  
    </header>  
  
    <div class="container" style="margin-top:40px;">  
        <h2 class="section-title">My Account</h2>  
          
        <div style="background:var(--white); padding:20px; border-radius:var(--radius); box-shadow:var(--shadow);">  
            <h3>Order History</h3>  
            <div style="overflow-x:auto; margin-top:15px;">  
                <table style="width:100%; border-collapse:collapse; text-align:left;">  
                    <thead>  
                        <tr style="background:#edf2f7;">  
                            <th style="padding:10px;">Order ID</th>  
                            <th style="padding:10px;">Date</th>  
                            <th style="padding:10px;">Amount</th>  
                            <th style="padding:10px;">Status</th>  
                        </tr>  
                    </thead>  
                    <tbody id="orders-tbody">  
                        <tr><td colspan="4" style="padding:10px;">Loading...</td></tr>  
                    </tbody>  
                </table>  
            </div>  
        </div>  
    </div>  
  
    <script type="module" src="app.js"></script>  
    <script type="module">  
        import { auth } from './firebase.js';  
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";  
        import { getMyOrders } from './database.js';
        import { escapeHtml, formatTimestamp } from './utils.js';  
  
        onAuthStateChanged(auth, async (user) => {  
            if(!user) { window.location.href = 'login.html'; return; }  
            const orders = await getMyOrders();  
            const tbody = document.getElementById('orders-tbody');  
            if(orders.length === 0) {  
                tbody.innerHTML = '<tr><td colspan="4" style="padding:10px;">No orders found.</td></tr>';  
                return;  
            }  
            tbody.innerHTML = orders.map(o => `  
                <tr style="border-bottom:1px solid #e2e8f0;">  
                    <td style="padding:10px;">${escapeHtml(o.id)}</td>  
                    <td style="padding:10px;">${escapeHtml(formatTimestamp(o.createdAt))}</td>  
                    <td style="padding:10px;">₹${escapeHtml(o.totalAmount)}</td>  
                    <td style="padding:10px;"><span class="badge ${o.status === 'completed' ? 'badge-blue' : 'badge-red'}">${escapeHtml(String(o.status || '').toUpperCase())}</span></td>  
                </tr>  
            `).join('');  
        });  
    </script>  
</body>  
</html>
