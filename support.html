
<!DOCTYPE html>  
<html lang="en">  
<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>Support & Contact - Baba Plastic</title>  
    <link rel="stylesheet" href="style.css">  
</head>  
<body>  
    <header>  
        <div class="container nav-container">  
            <a href="index.html" class="logo cms-site-logo"><span class="cms-site-name">Baba Plastic</span></a>  
            <button class="hamburger" id="hamburger">  
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>  
            </button>  
            <nav class="nav-links" id="nav-links">  
                <a href="index.html">Home</a>  
                <a href="categories.html">Categories</a>  
                <a href="products.html">Products</a>  
                <a href="about.html">About Us</a>  
                <a href="support.html" style="color:var(--secondary);">Support</a>  
                <div id="auth-nav-ui"></div>  
            </nav>  
        </div>  
    </header>  
  
    <div class="container" style="margin-top:40px; margin-bottom:60px;">  
        <h1 class="section-title">Support & Contact</h1>  
          
        <div class="grid grid-2" style="grid-template-columns: 1fr 1fr; gap:40px;">  
            <!-- Contact Info -->  
            <div style="background:var(--white); padding:40px; border-radius:var(--radius); box-shadow:var(--shadow);">  
                <h2 style="margin-bottom:20px; color:var(--primary);">Get in Touch</h2>  
                <div style="margin-bottom:20px;">  
                    <strong>📍 Address:</strong>  
                    <p class="cms-site-address" style="margin-top:5px;">Loading...</p>  
                </div>  
                <div style="margin-bottom:20px;">  
                    <strong>📞 Phone / WhatsApp:</strong>  
                    <p class="cms-site-phone" style="margin-top:5px;">Loading...</p>  
                </div>  
                <div style="margin-bottom:20px;">  
                    <strong>✉️ Email:</strong>  
                    <p class="cms-site-email" style="margin-top:5px;">Loading...</p>  
                </div>  
                <div>  
                    <strong>🕒 Working Hours:</strong>  
                    <p id="cms-working-hours" style="margin-top:5px;">Loading...</p>  
                </div>  
            </div>  
  
            <!-- Contact Form -->  
            <div style="background:var(--white); padding:40px; border-radius:var(--radius); box-shadow:var(--shadow);">  
                <h2 style="margin-bottom:20px; color:var(--primary);">Send a Message</h2>  
                <form id="contact-form">  
                    <div class="form-group"><label>Name / Company Name</label><input type="text" id="c-name" class="form-control" required></div>  
                    <div class="form-group"><label>Email</label><input type="email" id="c-email" class="form-control" required></div>  
                    <div class="form-group"><label>Phone</label><input type="text" id="c-phone" class="form-control" required></div>  
                    <div class="form-group"><label>Message</label><textarea id="c-msg" class="form-control" rows="4" required></textarea></div>  
                    <button type="submit" class="btn btn-primary" style="width:100%;" id="contact-btn">Send Message</button>  
                </form>  
            </div>  
        </div>  
    </div>  
  
    <footer>  
        <div class="container" style="text-align:center;">&copy; <span id="year"></span> <span class="cms-site-name">Baba Plastic</span></div>  
    </footer>  
  
    <script type="module" src="app.js"></script>  
    <script type="module">  
        import { getSiteSettings, submitEnquiry } from './database.js';  
          
        document.addEventListener('DOMContentLoaded', async () => {  
            try {  
                const settings = await getSiteSettings();  
                if(settings) {  
                    document.querySelectorAll('.cms-site-address').forEach(el => el.innerText = settings.contactAddress || "");  
                    document.getElementById('cms-working-hours').innerText = settings.workingHours || "Mon-Sat, 9AM - 6PM";  
                }  
            } catch(e) {}  
        });  
  
        document.getElementById('contact-form').addEventListener('submit', async (e) => {  
            e.preventDefault();  
            const btn = document.getElementById('contact-btn');  
            btn.disabled = true;  
            btn.innerText = "Sending...";  
            try {  
                // Using enquiry function as generic contact submission internally  
                await submitEnquiry({  
                    productId: 'General Contact',  
                    qty: 0,  
                    companyName: document.getElementById('c-name').value,  
                    email: document.getElementById('c-email').value,  
                    phone: document.getElementById('c-phone').value,  
                    message: document.getElementById('c-msg').value  
                });  
                window.showToast("Message sent successfully!");  
                document.getElementById('contact-form').reset();  
            } catch (err) {  
                window.showToast("Error sending message.", "error");  
            } finally {  
                btn.disabled = false;  
                btn.innerText = "Send Message";  
            }  
        });  
    </script>  
</body>  
</html>
