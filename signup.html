<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Signup - Baba Plastic</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<header>

    <div class="container nav-container">

        <a
            href="index.html"
            class="logo cms-site-logo"
        >

            <span class="cms-site-name">
                Baba Plastic
            </span>

        </a>

    </div>

</header>


<div
    class="container"
    style="
        max-width:400px;
        margin-top:50px;
        background:var(--white);
        padding:30px;
        border-radius:var(--radius);
        box-shadow:var(--shadow);
    "
>


    <h2 style="margin-bottom:20px;">
        Create B2B Account
    </h2>


    <form id="signup-form">


        <div class="form-group">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                class="form-control"
                autocomplete="email"
                required
            >

        </div>


        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                class="form-control"
                autocomplete="new-password"
                minlength="6"
                required
            >

        </div>


        <div class="form-group">

            <label for="cpassword">
                Confirm Password
            </label>

            <input
                type="password"
                id="cpassword"
                class="form-control"
                autocomplete="new-password"
                minlength="6"
                required
            >

        </div>


        <button
            type="submit"
            class="btn btn-primary"
            style="width:100%;"
            id="signup-btn"
        >
            Create Account
        </button>


    </form>


    <div
        style="
            margin-top:15px;
            text-align:center;
        "
    >

        <a
            href="login.html"
            style="font-size:14px;"
        >
            Already have an account? Login
        </a>

    </div>


</div>


<script
    type="module"
    src="app.js"
></script>


<script type="module">

import { AuthAPI } from "./auth.js";


document
    .getElementById("signup-form")
    .addEventListener(
        "submit",
        async (event) => {

            event.preventDefault();


            const btn =
                document.getElementById(
                    "signup-btn"
                );


            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();


            const password =
                document
                    .getElementById("password")
                    .value;


            const confirmPassword =
                document
                    .getElementById("cpassword")
                    .value;


            if (
                password !==
                confirmPassword
            ) {

                window.showToast(
                    "Passwords do not match.",
                    "error"
                );

                return;
            }


            if (password.length < 6) {

                window.showToast(
                    "Password must be at least 6 characters.",
                    "error"
                );

                return;
            }


            btn.disabled = true;

            btn.textContent =
                "Creating account...";


            try {

                await AuthAPI.signup(
                    email,
                    password
                );


                window.showToast(
                    "Account created successfully."
                );


                setTimeout(
                    () => {

                        window.location.href =
                            "account.html";

                    },
                    800
                );


            } catch (error) {

                console.error(error);


                if (
                    error.code ===
                    "auth/email-already-in-use"
                ) {

                    window.showToast(
                        "Email is already registered.",
                        "error"
                    );

                } else {

                    window.showToast(
                        error.message ||
                        "Unable to create account.",
                        "error"
                    );
                }


            } finally {

                btn.disabled = false;

                btn.textContent =
                    "Create Account";
            }

        }
    );

</script>


</body>
</html>
