<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Baba Plastic</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<header>

    <div class="container nav-container">

        <a
            href="index.html"
            class="logo cms-site-logo"
        >

            <span class="cms-site-name">
                Baba Plastic
            </span>

        </a>

    </div>

</header>


<div
    class="container"
    style="
        max-width:400px;
        margin-top:50px;
        background:var(--white);
        padding:30px;
        border-radius:var(--radius);
        box-shadow:var(--shadow);
    "
>

    <h2 style="margin-bottom:20px;">
        Customer Login
    </h2>


    <form id="login-form">

        <div class="form-group">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                class="form-control"
                autocomplete="email"
                required
            >

        </div>


        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                class="form-control"
                autocomplete="current-password"
                required
            >

        </div>


        <button
            type="submit"
            class="btn btn-primary"
            style="width:100%;"
            id="login-btn"
        >
            Login
        </button>

    </form>


    <div
        style="
            margin-top:15px;
            text-align:center;
        "
    >

        <a
            href="#"
            id="forgot-pass-link"
            style="
                color:var(--secondary);
                font-size:14px;
            "
        >
            Forgot Password?
        </a>

        <br>
        <br>

        <a
            href="signup.html"
            style="font-size:14px;"
        >
            Don't have an account? Sign up
        </a>

    </div>

</div>


<script
    type="module"
    src="app.js"
></script>


<script type="module">

import { AuthAPI } from "./auth.js";


const loginForm =
    document.getElementById("login-form");

const forgotLink =
    document.getElementById("forgot-pass-link");


loginForm.addEventListener(
    "submit",
    async (event) => {

        event.preventDefault();


        const btn =
            document.getElementById(
                "login-btn"
            );


        const email =
            document
                .getElementById("email")
                .value
                .trim();


        const password =
            document
                .getElementById("password")
                .value;


        btn.disabled = true;

        btn.textContent =
            "Signing in...";


        try {

            await AuthAPI.login(
                email,
                password
            );


            window.location.href =
                "account.html";


        } catch (error) {

            console.error(error);

            window.showToast(
                "Email or password is incorrect.",
                "error"
            );

        } finally {

            btn.disabled = false;

            btn.textContent =
                "Login";
        }

    }
);


forgotLink.addEventListener(
    "click",
    async (event) => {

        event.preventDefault();


        const email =
            document
                .getElementById("email")
                .value
                .trim();


        if (!email) {

            window.showToast(
                "Please enter your email first.",
                "error"
            );

            return;
        }


        try {

            await AuthAPI.resetPassword(
                email
            );


            window.showToast(
                "Password reset email sent. Check your inbox."
            );


        } catch (error) {

            console.error(error);

            window.showToast(
                "Unable to send password reset email.",
                "error"
            );
        }

    }
);

</script>


</body>
</html>
